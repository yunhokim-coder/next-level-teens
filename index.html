<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NEXT LINE</title>
  <meta name="description" content="NEXT LINE: 공부, 내일의 역">
  <meta name="app-version" content="20261028a">
  <link rel="preload" href="assets/fonts/Galmuri11.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=20261028a">
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="game" width="320" height="180" aria-label="NEXT LINE"></canvas>

      <!-- 미니 초상화: 2화 전에는 실루엣과 ? -->
      <div id="portrait" hidden>
        <canvas id="portrait-canvas" width="24" height="32" aria-hidden="true"></canvas>
        <div class="portrait-info">
          <span class="portrait-label" data-i18n="hud.passenger"></span>
          <span class="portrait-name" id="portrait-name">???</span>
          <span class="portrait-type" id="portrait-type" hidden></span>
        </div>
      </div>
      <button id="sound-btn" class="hud-btn" type="button" data-i18n-aria="hud.sound">♪</button>

      <!-- 타이틀 -->
      <div id="title-screen" class="overlay overlay-clear" hidden>
        <div class="logo">
          <div class="logo-main" aria-label="NEXT LINE"><span>NEXT</span> <span class="logo-line">LINE</span></div>
          <div class="logo-route" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
          <div class="logo-sign"><span class="logo-sign-tag">NEXT STOP</span><span class="logo-sub" data-i18n="title.sub"></span></div>
        </div>
        <div class="title-btns">
          <button id="start-btn" class="press" type="button" data-i18n="title.start"></button>
          <button id="new-btn" class="press-sub" type="button" hidden data-i18n="title.new"></button>
          <div class="rotate-hint" data-i18n="title.rotate"></div>
        </div>
        <div class="credit" data-i18n="title.credit"></div>
      </div>

      <!-- 둘러보기 화살표 -->
      <button id="look-left" class="look-btn left" type="button" hidden data-i18n-aria="look.left">◀</button>
      <button id="look-right" class="look-btn right" type="button" hidden data-i18n-aria="look.right">▶</button>
      <div id="look-hint" class="hint" hidden></div>

      <!-- 걷기 버튼 (터치용) -->
      <div id="walk-pad" hidden>
        <button id="walk-left" type="button" data-i18n-aria="look.left">◀</button>
        <button id="walk-right" type="button" data-i18n-aria="look.right">▶</button>
      </div>

      <!-- 한 줄 알림 (포스터·자판기 등) -->
      <div id="toast" hidden></div>

      <!-- 익명 데이터 동의 -->
      <div id="consent-screen" class="overlay" hidden>
        <div class="panel form-panel">
          <div class="clear-stop" data-i18n="consent.tag"></div>
          <h2 data-i18n="consent.title"></h2>
          <ul class="consent-list">
            <li data-i18n="consent.l1"></li>
            <li data-i18n="consent.l2"></li>
            <li data-i18n="consent.l3"></li>
            <li data-i18n="consent.l4"></li>
          </ul>
          <button id="consent-yes" class="btn btn-primary" type="button" data-i18n="consent.yes"></button>
          <button id="consent-no" class="btn" type="button" data-i18n="consent.no"></button>
        </div>
      </div>

      <!-- 승객 등록 -->
      <div id="setup-screen" class="overlay" hidden>
        <div class="panel form-panel">
          <div class="clear-stop" data-i18n="setup.tag"></div>
          <h2 data-i18n="setup.title"></h2>
          <label class="field-label" data-i18n="setup.name"></label>
          <div class="name-row">
            <div class="name-col"><button type="button" class="mini" data-name="a" data-step="-1">◀</button><button type="button" class="mini" data-name="a" data-step="1">▶</button></div>
            <div id="setup-name" class="name-box"></div>
            <div class="name-col"><button type="button" class="mini" data-name="b" data-step="-1">◀</button><button type="button" class="mini" data-name="b" data-step="1">▶</button></div>
          </div>
          <button id="name-random" type="button" class="mini wide" data-i18n="setup.random"></button>
          <label class="field-label" for="setup-grade" data-i18n="setup.grade"></label>
          <select id="setup-grade" class="field"></select>
          <span class="field-label" data-i18n="setup.gender"></span>
          <div id="setup-gender" class="seg"></div>
          <span class="field-label" data-i18n="setup.achievement"></span>
          <div class="field-help" data-i18n="setup.achievementHelp"></div>
          <div id="setup-ach" class="seg seg-wrap"></div>
          <div id="setup-error" class="error" hidden data-i18n="setup.error"></div>
          <div class="code-box"><span data-i18n="setup.code"></span> <strong id="setup-code"></strong></div>
          <button id="setup-go" class="btn btn-primary" type="button" data-i18n="setup.go"></button>
        </div>
      </div>

      <!-- 설문 (사전·사후·만족도) -->
      <div id="survey-screen" class="overlay" hidden>
        <div class="panel form-panel">
          <div class="clear-stop" id="survey-tag"></div>
          <h2 id="survey-title"></h2>
          <p class="muted" id="survey-lead"></p>
          <div id="survey-items"></div>
          <div id="survey-error" class="error" hidden data-i18n="survey.error"></div>
          <button id="survey-go" class="btn btn-primary" type="button" data-i18n="survey.go"></button>
        </div>
      </div>

      <!-- 2화 성향 질문 -->
      <div id="quiz-screen" class="overlay" hidden>
        <div class="panel form-panel">
          <div class="quiz-top"><button id="quiz-back" class="mini" type="button" data-i18n-aria="quiz.back">◀</button><span class="clear-stop" data-i18n="quiz.tag"></span><span id="quiz-count" class="quiz-count"></span></div>
          <div class="quiz-progress"><i id="quiz-bar"></i></div>
          <h2 data-i18n="quiz.title"></h2>
          <p class="muted" data-i18n="quiz.lead"></p>
          <div id="quiz-options" class="quiz-options"></div>
        </div>
      </div>
      <div id="tie-screen" class="overlay" hidden>
        <div class="panel form-panel">
          <div class="clear-stop" data-i18n="quiz.tag"></div>
          <h2 id="tie-title"></h2>
          <div id="tie-options" class="quiz-options"></div>
        </div>
      </div>

      <!-- 2화 캐릭터 카드 -->
      <div id="result-screen" class="overlay" hidden>
        <div class="panel form-panel result-panel">
          <div class="clear-stop" id="result-line"></div>
          <div class="result-head">
            <canvas id="result-canvas" width="32" height="32" aria-hidden="true"></canvas>
            <div><h2 id="result-name"></h2><div id="result-animal" class="muted"></div></div>
          </div>
          <p id="result-summary"></p>
          <div class="result-row"><b data-i18n="result.strengths"></b><span id="result-strengths"></span></div>
          <div class="result-row"><b data-i18n="result.watch"></b><span id="result-watch"></span></div>
          <div class="result-row"><b data-i18n="result.study"></b><span id="result-study"></span></div>
          <div class="result-row"><b data-i18n="result.mix"></b><span id="result-mix"></span></div>
          <button id="result-go" class="btn btn-primary" type="button" data-i18n="result.go"></button>
        </div>
      </div>

      <!-- 노선도 (목차): 지난 역은 다시 보기, 다음 역은 열림, 그 뒤는 잠김 -->
      <div id="map-screen" class="overlay" hidden>
        <div class="panel form-panel map-panel">
          <div class="clear-stop" data-i18n="map.tag"></div>
          <h2 id="map-title"></h2>
          <ol id="map-list" class="map-list"></ol>
          <button id="map-survey" class="btn btn-primary" type="button" hidden data-i18n="clear.toSurvey"></button>
        </div>
      </div>

      <!-- 2화 겉모습 고르기: 성향과 상관없이 동물 4종 중 하나 -->
      <div id="avatar-screen" class="overlay" hidden>
        <div class="panel form-panel">
          <div class="clear-stop" data-i18n="avatar.tag"></div>
          <h2 data-i18n="avatar.title"></h2>
          <p class="muted" data-i18n="avatar.lead"></p>
          <div id="avatar-options" class="avatar-options"></div>
        </div>
      </div>

      <!-- 3화 종착역 -->
      <div id="dest-screen" class="overlay" hidden>
        <div class="panel form-panel">
          <div class="clear-stop" data-i18n="ep3.destTag"></div>
          <h2 data-i18n="ep3.destTitle"></h2>
          <p class="muted" data-i18n="ep3.destLead"></p>
          <label class="field-label" for="dest-own" data-i18n="ep3.destOwn"></label>
          <div class="dest-frame"><span class="dest-pre" data-i18n="ep3.framePre"></span><input id="dest-own" class="field field-big" maxlength="50" autocomplete="off" data-i18n-placeholder="ep3.destOwnPh"><span class="dest-suf" data-i18n="ep3.frameSuf"></span></div>
          <p class="field-help" data-i18n="ep3.destHelp"></p>
          <div id="dest-error" class="error" hidden data-i18n="ep3.destEmpty"></div>
          <button id="dest-own-go" class="btn btn-primary" type="button" data-i18n="ep3.ok"></button>
          <button id="dest-ideas" class="btn btn-ghost" type="button" aria-expanded="false" data-i18n="ep3.destIdeas"></button>
          <div id="dest-ideas-box" hidden>
            <p class="field-help" data-i18n="ep3.destIdeasLead"></p>
            <div id="dest-options" class="dest-options"></div>
          </div>
          <button id="dest-unknown" class="btn" type="button" data-i18n="ep3.destUnknown"></button>
        </div>
      </div>
      <div id="fuel-screen" class="overlay" hidden>
        <div class="panel form-panel">
          <div class="clear-stop" data-i18n="ep3.fuelTag"></div>
          <h2 data-i18n="ep3.fuelTitle"></h2>
          <p class="muted" data-i18n="ep3.fuelLead"></p>
          <div id="fuel-options" class="fuel-options"></div>
          <button id="fuel-go" class="btn btn-primary" type="button" data-i18n="ep3.fuelGo"></button>
        </div>
      </div>
      <div id="gauge-screen" class="overlay" hidden>
        <div class="panel form-panel">
          <div class="clear-stop" data-i18n="ep3.fuelTag"></div>
          <h2 id="gauge-main"></h2>
          <div id="gauge-bars" class="gauge-bars"></div>
          <button id="gauge-go" class="btn btn-primary" type="button" data-i18n="result.go"></button>
        </div>
      </div>
      <div id="util-screen" class="overlay" hidden>
        <div class="panel form-panel">
          <div class="clear-stop" data-i18n="ep3.utilTag"></div>
          <h2 id="util-title"></h2>
          <p class="muted" data-i18n="ep3.utilLead"></p>
          <div id="util-options" class="chips"></div>
          <label class="field-label" for="util-own" data-i18n="ep3.utilOwn"></label>
          <input id="util-own" class="field" maxlength="80" autocomplete="off" data-i18n-placeholder="ep3.utilOwnPh">
          <div id="util-error" class="error" hidden data-i18n="ep3.utilError"></div>
          <button id="util-go" class="btn btn-primary" type="button" data-i18n="survey.go"></button>
        </div>
      </div>

      <!-- 4화 운행 방해 -->
      <div id="mamba-screen" class="overlay" hidden>
        <div class="panel form-panel">
          <div class="clear-stop" data-i18n="ep4.tag"></div>
          <h2 data-i18n="ep4.title"></h2>
          <p class="muted" data-i18n="ep4.lead"></p>
          <div id="mamba-tabs" class="tabs"></div>
          <div id="mamba-grid" class="mamba-grid"></div>
          <div class="mamba-foot"><span id="mamba-need" class="muted"></span></div>
          <div id="mamba-error" class="error" hidden></div>
          <button id="mamba-done" class="btn btn-primary" type="button" data-i18n="ep4.done"></button>
        </div>
      </div>
      <div id="freq-screen" class="overlay" hidden>
        <div class="panel form-panel">
          <div class="clear-stop" data-i18n="ep4.tag"></div>
          <h2 data-i18n="ep4.freqTitle"></h2>
          <div id="freq-list" class="freq-list"></div>
          <div id="freq-error" class="error" hidden data-i18n="ep4.freqError"></div>
          <button id="freq-done" class="btn btn-primary" type="button" data-i18n="survey.go"></button>
        </div>
      </div>
      <div id="name-screen" class="overlay" hidden>
        <div class="panel form-panel">
          <div class="clear-stop" data-i18n="ep4.tag"></div>
          <h2 data-i18n="ep4.nameTitle"></h2>
          <p class="muted" data-i18n="ep4.nameLead"></p>
          <div class="name-join"><span id="name-word" class="name-word"></span><input id="name-own" class="field field-big" maxlength="10" autocomplete="off" data-i18n-placeholder="ep4.namePh"></div>
          <p id="name-preview" class="name-preview"></p>
          <p class="field-help" data-i18n="ep4.nameIdeasLead"></p>
          <div id="name-ideas" class="chips"></div>
          <div id="name-error" class="error" hidden data-i18n="ep4.nameError"></div>
          <button id="name-go" class="btn btn-primary" type="button" data-i18n="ep4.nameGo"></button>
        </div>
      </div>
      <!-- 5화 우회 노선 배틀: 손패, 크게 보기, 전체 카드, 오늘의 우회 노선 -->
      <div id="hand-screen" class="overlay" hidden>
        <div class="hand-wrap">
          <div id="hand-attack" class="hand-attack"></div>
          <p class="hand-lead" data-i18n="ep5.handLead"></p>
          <div id="hand-fan" class="hand-fan"></div>
          <button id="hand-deck" class="btn" type="button" data-i18n="ep5.deck"></button>
        </div>
      </div>
      <div id="zoom-screen" class="overlay" hidden>
        <div class="panel zoom-panel">
          <div id="zoom-card" class="zoom-card"></div>
          <p id="zoom-match" class="zoom-match" hidden></p>
          <button id="zoom-use" class="btn btn-primary" type="button" data-i18n="ep5.use"></button>
          <button id="zoom-back" class="btn" type="button" data-i18n="ep5.back"></button>
        </div>
      </div>
      <div id="deck-screen" class="overlay" hidden>
        <div class="panel form-panel">
          <div class="clear-stop" data-i18n="ep5.tag"></div>
          <h2 data-i18n="ep5.deckTitle"></h2>
          <p class="muted" data-i18n="ep5.deckLead"></p>
          <div id="deck-tabs" class="tabs"></div>
          <div id="deck-grid" class="mamba-grid"></div>
          <button id="deck-close" class="btn" type="button" data-i18n="ep5.deckClose"></button>
        </div>
      </div>
      <div id="route-screen" class="overlay" hidden>
        <div class="panel form-panel">
          <div class="clear-stop" data-i18n="ep5.tag"></div>
          <h2 data-i18n="ep5.routeTitle"></h2>
          <p class="muted" data-i18n="ep5.routeLead"></p>
          <div id="route-list" class="route-list"></div>
          <button id="route-go" class="btn btn-primary" type="button" data-i18n="ep5.routeGo"></button>
        </div>
      </div>
      <!-- 6화 노선도 완성 -->
      <div id="grow-screen" class="overlay" hidden>
        <div class="panel form-panel grow-panel">
          <div class="clear-stop" data-i18n="ep6.tag"></div>
          <div id="grow-steps" class="grow-steps">
            <div class="gstep" data-k="g"><b>G</b><span data-i18n="ep6.stepG"></span></div>
            <div class="gstep" data-k="r"><b>R</b><span data-i18n="ep6.stepR"></span></div>
            <div class="gstep" data-k="o"><b>O</b><span data-i18n="ep6.stepO"></span></div>
            <div class="gstep" data-k="w"><b>W</b><span data-i18n="ep6.stepW"></span></div>
          </div>
          <div id="grow-goal" class="grow-goal" hidden></div>
          <div class="grow-nova-row">
            <canvas id="grow-nova" width="88" height="128" aria-hidden="true"></canvas>
            <div id="grow-tip" class="grow-tip"></div>
          </div>
          <h2 id="grow-title"></h2>
          <div id="grow-body"></div>
          <div id="grow-error" class="error" hidden></div>
          <div class="grow-btns">
            <button id="grow-back" class="btn" type="button" data-i18n="ep6.growBack"></button>
            <button id="grow-next" class="btn btn-primary" type="button"></button>
          </div>
        </div>
      </div>
      <div id="station-screen" class="overlay" hidden>
        <div class="panel form-panel">
          <div class="clear-stop" data-i18n="ep6.tag"></div>
          <h2 data-i18n="ep6.stationTitle"></h2>
          <p class="muted" data-i18n="ep6.stationLead"></p>
          <input id="station-own" class="field field-big" maxlength="20" autocomplete="off" data-i18n-placeholder="ep6.stationPh">
          <p class="field-help" data-i18n="ep6.stationIdeasLead"></p>
          <div id="station-ideas" class="chips"></div>
          <div id="station-error" class="error" hidden data-i18n="ep6.stationError"></div>
          <button id="station-go" class="btn btn-primary" type="button" data-i18n="ep6.stationGo"></button>
        </div>
      </div>
      <div id="routemap-screen" class="overlay" hidden>
        <div class="panel form-panel routemap-panel">
          <div class="clear-stop" data-i18n="ep6.tag"></div>
          <h2 data-i18n="ep6.cardsTitle"></h2>
          <div id="card-tabs" class="tabs"></div>
          <canvas id="routemap-canvas" width="1080" height="1080" aria-label="route map"></canvas>
          <p class="muted" data-i18n="ep6.mapLead"></p>
          <div class="routemap-btns">
            <button id="routemap-save" class="btn" type="button" data-i18n="ep6.saveSquare"></button>
            <button id="routemap-wall" class="btn" type="button" data-i18n="ep6.saveWall"></button>
            <button id="routemap-print" class="btn" type="button" data-i18n="ep6.print"></button>
          </div>
          <p id="save-tip" class="save-tip" hidden data-i18n="ep6.saveTipIos"></p>
          <button id="routemap-go" class="btn btn-primary" type="button" data-i18n="ep6.mapGo"></button>
        </div>
      </div>

      <!-- 끝 인사 -->
      <div id="thanks-screen" class="overlay" hidden>
        <div class="panel">
          <div class="clear-stop">NEXT STOP</div>
          <h2 data-i18n="thanks.title"></h2>
          <p data-i18n="thanks.body"></p>
          <p class="muted"><span data-i18n="setup.code"></span> <strong id="thanks-code"></strong></p>
          <button id="thanks-routemap" class="btn btn-primary" type="button" hidden data-i18n="ep6.again"></button>
          <button id="thanks-replay" class="btn" type="button" data-i18n="map.open"></button>
        </div>
      </div>

      <!-- 데모 끝 -->
      <div id="clear-screen" class="overlay" hidden>
        <div class="panel">
          <div class="clear-stop" id="clear-stop"></div>
          <h2 id="clear-title"></h2>
          <p id="clear-next"></p>
          <p class="muted" id="clear-demo" data-i18n="clear.demo"></p>
          <button id="replay-btn" class="btn btn-primary" type="button"></button>
          <button id="clear-map" class="btn" type="button" data-i18n="map.open"></button>
        </div>
      </div>

      <!-- 언어 선택 -->
      <div id="lang-screen" class="overlay">
        <div class="panel lang-panel">
          <div class="logo-main small">NEXT LINE</div>
          <button class="btn" type="button" data-pick-lang="ko">한국어</button>
          <button class="btn" type="button" data-pick-lang="en">English</button>
        </div>
      </div>
    </div>

    <div id="print-area" aria-hidden="true"><img id="print-img" alt=""></div>
    <div id="save-screen" hidden>
      <p class="save-hint" data-i18n="ep6.saveHint"></p>
      <img id="save-img" alt="">
      <button id="save-close" class="btn" type="button" data-i18n="ep6.saveClose"></button>
    </div>
    <div id="dialog" hidden>
      <div id="dialog-name"></div>
      <div id="dialog-text"></div>
      <div id="choices" hidden></div>
      <div class="dialog-next">▼</div>
    </div>
  </div>

  <script src="config.js?v=20261028a"></script>
  <script src="js/i18n.js?v=20261028a"></script>
  <script src="js/sound.js?v=20261028a"></script>
  <script src="js/data.js?v=20261028a"></script>
  <script src="js/story.js?v=20261028a"></script>
  <script src="js/chars.js?v=20261028a"></script>
  <script src="js/game.js?v=20261028a"></script>
  <script src="js/quiz.js?v=20261028a"></script>
  <script src="js/station.js?v=20261028a"></script>
  <script src="js/mamba.js?v=20261028a"></script>
  <script src="js/battle.js?v=20261028a"></script>
  <script src="js/ai.js?v=20261028a"></script>
  <script src="js/coach.js?v=20261028a"></script>
  <script src="js/grow.js?v=20261028a"></script>
  <script src="js/finale.js?v=20261028a"></script>
  <script src="js/main.js?v=20261028a"></script>
</body>
</html>
